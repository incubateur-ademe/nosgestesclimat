name: Test dispatching a model update to incubateur-ademe/nosgestesclimat-app

on:
  pull_request:
    branches:
      - master

jobs:
  # Tests the new dispatch-based flow: sends a repository_dispatch event to
  # incubateur-ademe/nosgestesclimat-app (event_type: model-release) with a
  # hardcoded test version. This triggers the app's own "Update model" workflow
  # (.github/workflows/common:update-model.yaml), which runs the app's update
  # script (.github/scripts/update-model-version.mjs) and opens the dependency
  # bump PR. Everything else runs in the app, not here.
  dispatch_model_update_to_app:
    name: Dispatch model update to app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEW_VERSION: 4.14.3
      IS_PRE_RELEASE: 'false'
    steps:
      # GITHUB_TOKEN is scoped to this repository, so we generate a temporary
      # GitHub App token with write access to incubateur-ademe/nosgestesclimat-app
      # to trigger the repository_dispatch event on that repository.
      - name: Generate GitHub App token
        if: env.IS_PRE_RELEASE != 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MODEL_BOT_APP_ID }}
          private-key: ${{ secrets.MODEL_BOT_APP_PRIVATE_KEY }}
          owner: incubateur-ademe
          repositories: nosgestesclimat-app

      # Test: version is hardcoded to test the dispatch without a real release.
      - name: Dispatch update to app
        if: env.IS_PRE_RELEASE != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'incubateur-ademe',
              repo: 'nosgestesclimat-app',
              event_type: 'model-release',
              client_payload: {
                version: process.env.NEW_VERSION,
              },
            })
