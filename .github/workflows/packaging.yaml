# From: https://github.com/garronej/ts-ci

name: GitHub release / NPM publishing

on:
  push:
    branches:
      - master

jobs:
  check_if_version_upgraded:
    name: Check if version upgrade
    permissions:
      contents: read
    # When someone forks the repo and opens a PR we want to enables the tests to be run (the previous jobs)
    # but obviously only us should be allowed to release.
    # In the following check we make sure that we own the branch this CI workflow is running on before continuing.
    # Without this check, trying to release would fail anyway because only us have the correct secret.NPM_TOKEN but
    # it's cleaner to stop the execution instead of letting the CI crash.
    if: |
      github.event_name == 'push' || 
      github.event.pull_request.head.repo.owner.login == github.event.pull_request.base.repo.owner.login
    runs-on: ubuntu-latest
    outputs:
      from_version: ${{ steps.step1.outputs.from_version }}
      to_version: ${{ steps.step1.outputs.to_version }}
      is_upgraded_version: ${{ steps.step1.outputs.is_upgraded_version }}
      is_pre_release: ${{steps.step1.outputs.is_pre_release }}
    steps:
      - uses: garronej/ts-ci@v2.1.5
        id: step1
        with:
          action_name: is_package_json_version_upgraded
          branch: ${{ github.head_ref || github.ref }}

  create_github_release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # We create release only if the version in the package.json have been upgraded and this CI is running against the main branch.
    # We allow branches with a PR open on main to publish pre-release (x.y.z-rc.u) but not actual releases.
    if: |
      needs.check_if_version_upgraded.outputs.from_version != needs.check_if_version_upgraded.outputs.to_version
    needs:
      - check_if_version_upgraded
    steps:
      - uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ needs.check_if_version_upgraded.outputs.to_version }}
          tag_name: v${{ needs.check_if_version_upgraded.outputs.to_version }}
          target_commitish: ${{ github.head_ref || github.ref }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.check_if_version_upgraded.outputs.is_pre_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_on_npm:
    name: Publish on NPM
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: read
    needs:
      - create_github_release
      - check_if_version_upgraded
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          ref: ${{ github.ref }}
      - name: Install pnpm
        uses: pnpm/action-setup@bdf0af2a9d539c0fd91f655344d2934bfd5a2cdd
        with:
          version: 10.11.0
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: './package.json'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm package
      - name: Upload to Scaleway bucket
        run: |
          FILES_PATH=model/master
          AWS_ACCESS_KEY_ID=${{ secrets.SCW_ACCESS_KEY }} AWS_SECRET_ACCESS_KEY=${{ secrets.SCW_SECRET_KEY }} aws s3 rm s3://${{ vars.BUCKET_NAME }}/$FILES_PATH --recursive --endpoint-url ${{ vars.BUCKET_ENDPOINT }}
          AWS_ACCESS_KEY_ID=${{ secrets.SCW_ACCESS_KEY }} AWS_SECRET_ACCESS_KEY=${{ secrets.SCW_SECRET_KEY }} aws s3 cp public s3://${{ vars.BUCKET_NAME }}/$FILES_PATH --recursive --endpoint-url ${{ vars.BUCKET_ENDPOINT }} --acl public-read
      - name: Publishing on NPM
        run: |
          if [ "$(pnpm show . version)" = "$VERSION" ]; then
            echo "This version is already published"
            exit 0
          fi
          EXTRA_ARGS=""
          if [ "$IS_PRE_RELEASE" = "true" ]; then
              EXTRA_ARGS="--tag next"
          fi
          pnpm publish $EXTRA_ARGS
        env:
          VERSION: ${{ needs.check_if_version_upgraded.outputs.to_version }}
          IS_PRE_RELEASE: ${{ needs.check_if_version_upgraded.outputs.is_pre_release }}

  # Opens a PR in incubateur-ademe/nosgestesclimat-app updating the
  # @incubateur-ademe/nosgestesclimat dependency to the version just released.
  #
  # Everything runs from this repository: we checkout the app, run the app's
  # update script, and open the PR with a GitHub App token (so CI runs on it,
  # dependabot-style). Event-driven: only runs after a successful NPM publish,
  # no NPM polling.
  open_update_pr_in_app:
    name: Open update PR in app
    runs-on: ubuntu-latest
    needs:
      - publish_on_npm
      - check_if_version_upgraded
    env:
      NEW_VERSION: ${{ needs.check_if_version_upgraded.outputs.to_version }}
      IS_PRE_RELEASE: ${{ needs.check_if_version_upgraded.outputs.is_pre_release }}
    steps:
      - name: Skip pre-releases
        if: env.IS_PRE_RELEASE == 'true'
        run: |
          echo "Skipping pre-release $NEW_VERSION"
          exit 0

      # GITHUB_TOKEN is scoped to this repository, so we generate a temporary
      # GitHub App token with write access to incubateur-ademe/nosgestesclimat-app.
      - name: Generate GitHub App token
        if: env.IS_PRE_RELEASE != 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MODEL_BOT_APP_ID }}
          private-key: ${{ secrets.MODEL_BOT_APP_PRIVATE_KEY }}
          owner: incubateur-ademe
          repositories: nosgestesclimat-app

      - name: Checkout nosgestesclimat-app
        if: env.IS_PRE_RELEASE != 'true'
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          repository: incubateur-ademe/nosgestesclimat-app
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Update dependency version
        if: env.IS_PRE_RELEASE != 'true'
        run: node .github/scripts/update-model-version.mjs
        env:
          NEW_VERSION: ${{ needs.check_if_version_upgraded.outputs.to_version }}

      # Reconcile the lockfile with the bumped package.json, otherwise the
      # app's CI (pnpm install --frozen-lockfile) would fail on the PR.
      - name: Install pnpm
        if: env.IS_PRE_RELEASE != 'true'
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        if: env.IS_PRE_RELEASE != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: './package.json'
          cache: 'pnpm'

      # The package has just been published: retry briefly in case the npm
      # registry has not propagated the new version yet.
      - name: Update lockfile
        if: env.IS_PRE_RELEASE != 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            if pnpm install --lockfile-only; then
              exit 0
            fi
            echo "npm not ready yet, retry $attempt/5..."
            sleep 15
          done
          exit 1

      # Fetch the release notes generated for v${NEW_VERSION} and embed them in
      # the PR body. We use GITHUB_TOKEN here: the GitHub App token is scoped to
      # nosgestesclimat-app, not to this repository.
      - name: Build PR body from release notes
        if: env.IS_PRE_RELEASE != 'true'
        id: pr-body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_notes="$(gh release view "v${NEW_VERSION}" --repo incubateur-ademe/nosgestesclimat --json body --jq '.body')"

          {
            echo "pr_body<<PR_BODY_EOF"
            echo "## Summary"
            echo ""
            echo "Opened automatically after the release of [\`@incubateur-ademe/nosgestesclimat\` v${NEW_VERSION}](https://github.com/incubateur-ademe/nosgestesclimat/releases/tag/v${NEW_VERSION})."
            echo ""
            echo "This PR updates \`@incubateur-ademe/nosgestesclimat\` → \`v${NEW_VERSION}\` in:"
            echo "- \`packages/core/package.json\`"
            echo "- \`apps/server/package.json\`"
            echo "- \`apps/site/package.json\`"
            echo ""
            echo "and reconciles \`pnpm-lock.yaml\` with the new version."
            echo ""
            echo "## Release notes"
            echo ""
            echo "${release_notes}"
            echo ""
            echo "_Generated by the \`packaging\` workflow of the model repository — no NPM polling._"
            echo "PR_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: env.IS_PRE_RELEASE != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update-model/v${{ env.NEW_VERSION }}
          title: 'chore(deps): update @incubateur-ademe/nosgestesclimat to v${{ env.NEW_VERSION }}'
          commit-message: 'chore(deps): update @incubateur-ademe/nosgestesclimat to v${{ env.NEW_VERSION }}'
          body: ${{ steps.pr-body.outputs.pr_body }}
          labels: dependencies
          delete-branch: true
