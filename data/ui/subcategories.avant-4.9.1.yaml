# Sous catégories — variante pour les modèles ANTÉRIEURS à 4.9.1.
#
# ⚠️ Ce fichier ne contient que les règles qui diffèrent des fichiers de base,
# `subcategories.avant-4.16.0.yaml`, `subcategories.avant-4.10.1.yaml` et
# `subcategories.avant-4.10.0.yaml`. Il est fusionné par-dessus.
#
# ## Pourquoi cette variante
#
# La décomposition de `services sociétaux` s'appuie sur les règles
# `empreinte branche . <code> par hab . services publics` et
# `empreinte branche . <code> par hab . services marchands`, introduites en
# 4.9.1. Avant, les branches existent sans cette segmentation
# (`empreinte branche . <code> par hab`), donc les 26 règles feuilles du
# fichier de base sont inévaluables.
#
# ## Formule retenue
#
# On garde la finesse du CSV pour les versions qui la permettent, et on
# agrège pour les précédentes :
#
#   - chaque feuille vaut 0 ;
#   - `services publics` et `services marchands` valent la règle du modèle,
#     ce qui préserve le total de `bilan`.
#
# Conséquence : sur ces versions, le CSV n'a pas la ventilation par branche NAF,
# mais les colonnes existent (à 0) et les totaux restent justes.
#
# ⚠️ Choix assumé : la ventilation par branche n'est **pas** recalculée pour ces
# versions. Les postes qui s'appuient dessus (`services sociétaux . santé`,
# `défense`, `éducation`… de `ravijen.yaml`) valent donc 0 sur 4.6.0–4.8.1. Si
# une analyse avait besoin de ces postes sur cette période, il faudrait passer
# par `empreinte branche . <code> par hab` du modèle de l'époque (l'information
# existe, mais sans la séparation public / marchand).

bilan . sous catégories . services sociétaux . services publics:
  formule: services sociétaux . services publics

bilan . sous catégories . services sociétaux . services marchands:
  formule: services sociétaux . services marchands

