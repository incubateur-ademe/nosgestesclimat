# Sous catégories — variante pour les modèles ANTÉRIEURS à 4.16.0.
#
# ⚠️ Ce fichier ne contient que les règles qui diffèrent de
# `data/ui/subcategories.publicodes`. Il est fusionné par-dessus : les règles
# absentes d'ici sont reprises telles quelles du fichier principal.
#
# ## Pourquoi cette variante
#
# Le petit déjeuner a été refondu en 4.16.0 :
#
#   - avant 4.16.0 : un PROFIL agrégé, sans décomposition
#       `alimentation . petit déjeuner . type` (mosaïque) :
#       continental | lait céréales | britannique | végétalien | aucun
#     chacun portant une unique empreinte en dur ;
#
#   - à partir de 4.16.0 : des COMPOSANTS (`tartine`, `viennoiserie`, `yaourt`,
#     `charcuterie`, `fromage`, `oeufs`…), qui permettent de distinguer les
#     portions carné / lacté / sucré.
#
# Les règles `portion carné / lacté / sucré` du fichier principal référencent
# `alimentation . petit déjeuner . charcuterie`, `fromage`, `tartine`… qui
# n'existent pas avant 4.16.0.
#
# ## Mapping retenu
#
#   carné      -> britannique
#   lacté      -> lait céréales
#   sucré      -> continental, végétalien
#
# ## Bonus local et de saison
#
# Avant 4.16.0, `alimentation . repas` quantifiait sous forme d'un bonus la consommation de produits locaux et de saison. Ce bonus est supprimé dans les versions récentes.

bilan . sous catégories . alimentation . bonus local et de saison:
  formule: alimentation . bonus

bilan . sous catégories . alimentation . petit déjeuner portion carné:
  formule:
    variations:
      - si: alimentation . petit déjeuner . type = 'britannique'
        alors: alimentation . petit déjeuner * commun . jours par an
      - sinon: 0

bilan . sous catégories . alimentation . petit déjeuner portion lacté:
  formule:
    variations:
      - si: alimentation . petit déjeuner . type = 'lait céréales'
        alors: alimentation . petit déjeuner * commun . jours par an
      - sinon: 0

bilan . sous catégories . alimentation . petit déjeuner portion sucré:
  formule:
    variations:
      - si:
          une de ces conditions:
            - alimentation . petit déjeuner . type = 'continental'
            - alimentation . petit déjeuner . type = 'végétalien'
        alors: alimentation . petit déjeuner * commun . jours par an
      - sinon: 0
# ## Électricité du logement et mode de chauffage
#
# Avant 4.16.0, `logement . électricité . empreinte` se décompose selon le mode
# de chauffage :
#
#   - `collectif` / `pas de chauffage` → `consommation totale hors individuel`
#     (la consommation de chauffage n'est pas imputée au logement) ;
#   - sinon → `consommation totale`.
#
# Depuis 4.16.0, la formule vaut uniformément
# `consommation totale * empreinte au kWh` et `consommation totale hors
# individuel` n'est plus utilisée.
#
# ⚠️ Piège dans la branche collective : l'intensité carbone du mélange
# (`logement . électricité . intensité carbone équivalente`) est calculée avec
# `consommation totale`, alors que l'empreinte est appliquée à
# `consommation totale hors individuel` :
#
#     empreinte = hors individuel × mélange(consommation totale)
#
# Recalculer réseau et photovoltaïque séparément sur `hors individuel` ne tombe
# donc pas juste dès que la production photovoltaïque est inférieure à la
# consommation (écart observé : quelques kgCO2e, soit < 0,1 % du bilan).
#
# La règle `réseau` ci-dessous est donc calculée **par différence** sur cette
# seule branche : `réseau = empreinte / habitants − photovoltaïque`. La somme
# égale alors exactement `logement . électricité`, par construction. Les autres
# branches reprennent la règle du fichier de base, inchangée.
#
# `photovoltaique` n'est pas surchargé : la règle de base, exprimée sur
# `consommation totale`, correspond à la sémantique du modèle de l'époque.

bilan . sous catégories . logement . électricité . réseau:
  formule:
    variations:
      - si:
          toutes ces conditions:
            - est défini: logement . chauffage . mode
            - une de ces conditions:
                - logement . chauffage . mode = 'collectif'
                - logement . chauffage . mode = 'pas de chauffage'
        alors: logement . électricité . empreinte / logement . habitants - bilan . sous catégories . logement . électricité . photovoltaique
      - si: logement . électricité . photovoltaique . présent
        alors:
          variations:
            - si: logement . électricité . photovoltaique . production >= logement . électricité . consommation totale
              alors: 0
            - si: logement . électricité . photovoltaique . production < logement . électricité . consommation totale
              alors: (logement . électricité . consommation totale - logement . électricité . photovoltaique . production) * logement . électricité . réseau . intensité carbone / logement . habitants
      - sinon: logement . électricité . consommation totale * logement . électricité . réseau . intensité carbone / logement . habitants
